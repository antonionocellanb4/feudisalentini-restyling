<!-- bottiglia al centro: si apre col clic su una bottiglia (js/scheda.js), uguale in fiaba, moderna-d e moderna-e -->
<div class="fb-zoom" role="dialog" aria-modal="true" aria-labelledby="fb-zoom-t" tabindex="-1" hidden>
  <canvas class="fb-zoom__cv" aria-hidden="true"></canvas>
  <img class="fb-zoom__bt" alt="" decoding="async">
  <div class="fb-zoom__info">
    <p class="fb-zoom__col"></p>
    <h2 class="fb-zoom__t" id="fb-zoom-t"></h2>
    <p class="fb-zoom__meta"></p>
    <p class="fb-zoom__desc"></p>
    <dl class="fb-zoom__dati"></dl>
    <div class="fb-zoom__cta"><a class="btn btn--gold fb-zoom__go">Scheda del vino</a><button class="btn btn--line fb-zoom__col-go" type="button">Vini della collezione</button></div>
  </div>
  <button class="btn btn--line fb-zoom__x" type="button">Chiudi</button>
</div>
