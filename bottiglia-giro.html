<script>/* prova font: ?font=bricolage|funnel|archivo|newsreader, resta per la sessione */(function(){var F={klimt:"Fraunces:opsz,wght,SOFT,WONK@9..144,100..400,0..100,0..1&family=Instrument+Sans:wdth,wght@75..100,400..600",bricolage:"Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800",funnel:"Funnel+Display:wght@300..800&family=Funnel+Sans:wght@300..800",archivo:"Archivo:wdth,wght@62..125,100..900",newsreader:"Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800"};var f;try{f=new URLSearchParams(location.search).get("font")||sessionStorage.getItem("fs-font")}catch(e){}if(!F[f])f="klimt";try{sessionStorage.setItem("fs-font",f)}catch(e){}document.documentElement.dataset.font=f;document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family='+F[f]+'&display=swap">')})()</script>

<script>/* cambio di mood (17 nov): la pagina nuova si apre da dove si è scelto (css/nav.css, mood-apre). Al clic si annota la forma di partenza, "da|a|opacità" (due clip-path, e se la pagina nuova parte trasparente): il riquadro del link, oppure quella scritta nel link (data-mood-da) o da js/mood.js. All'arrivo, prima del primo disegno, la si passa al css. Senza appunto il passaggio non parte: gli altri link cambiano pagina come sempre. A passaggio finito si avvisa la barra (un evento scroll): durante il passaggio js/nav.js non vede cosa c'è sotto e sbaglia il tono */addEventListener("click",function(e){var p=e.target.closest&&e.target.closest("a[data-mood],a[data-mood-da]");if(!p||e.defaultPrevented)return;var da=p.getAttribute("data-mood-da");if(!da){var r=p.getBoundingClientRect(),w=innerWidth,h=innerHeight;da="inset("+[r.top/h,1-r.right/w,1-r.bottom/h,r.left/w].map(function(n){return(Math.max(0,n)*100).toFixed(2)+"%"}).join(" ")+")"}try{sessionStorage.setItem("fs-mood-da",da)}catch(x){}});addEventListener("pagereveal",function(e){var da;try{da=sessionStorage.getItem("fs-mood-da");sessionStorage.removeItem("fs-mood-da")}catch(x){}if(!e.viewTransition)return;e.viewTransition.finished.then(function(){dispatchEvent(new Event("scroll"))},function(){});if(da){da=da.split("|");var s=document.documentElement.style;s.setProperty("--mood-da",da[0]);s.setProperty("--mood-a",da[1]||"inset(0% 0% 0% 0%)");s.setProperty("--mood-o",da[2]||"1")}else{e.viewTransition.ready.catch(function(){});e.viewTransition.skipTransition()}});</script>

<style>
  .page-giro { background: #fff; }
  .giro { position: relative; min-height: 100svh; overflow: hidden; background: #fff; color: #111; font-family: 'Bricolage Grotesque', sans-serif; }
  .giro-t { position: absolute; left: var(--pad-x); top: 28px; margin: 0; font-family: inherit; font-size: clamp(1.75rem, 3vw, 2.75rem); font-weight: 700; font-stretch: 75%; line-height: 1; letter-spacing: -.01em; }
  .giro-t small { display: block; margin-top: 8px; font-size: 1rem; font-weight: 400; font-stretch: 100%; letter-spacing: 0; color: #444; }
  .giro-nota { position: absolute; right: var(--pad-x); top: 34px; margin: 0; font-size: 1rem; color: #444; }
  .giro-coppia { display: flex; justify-content: center; align-items: flex-end; gap: clamp(32px, 8vw, 160px); height: 100svh; padding: 110px 16px 24px; box-sizing: border-box; }
  .giro-col { display: grid; justify-items: center; gap: 14px; height: 100%; margin: 0; }
  .giro-col canvas { height: calc(100% - 60px); touch-action: pan-y; cursor: grab; }
  .giro-col canvas:active { cursor: grabbing; }
  .giro-col canvas:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
  .giro-col figcaption { max-width: 22rem; font-size: 1rem; line-height: 1.35; text-align: center; color: #222; }
  .giro-col figcaption small { display: block; font-size: .875rem; color: #555; }
  @media (max-width: 860px) {
    .giro-t { left: 16px; top: 20px; font-size: 1.5rem; }
    .giro-t small { font-size: .9375rem; }
    .giro-nota { display: none; }
    .giro-coppia { gap: 16px; padding: 96px 12px 16px; height: 100svh; }
    .giro-col canvas { height: calc(100% - 84px); }
    .giro-col figcaption { font-size: .875rem; }
    .giro-col figcaption small { font-size: .8125rem; }
  }
</style>
