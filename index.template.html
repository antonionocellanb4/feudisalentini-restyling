<!-- INGRESSO, la scelta del mood (rifatta il 20 nov 2026: "questa dobbiamo ripensare in base ai nuovi aggiornamenti senza mettere company e aggiornare nomi e font").
     È la prima pagina del sito; dalle pagine non ci porta più niente, il cambio di mood sta nell'angolo di ogni pagina (js/cambio-mood.js). I mood sono due, quelli dello switch
     (js/main.js, MOOD): Botanica (botanica-pop.html) e Pop (pop-b.html). Company resta fuori.
     Le due home ora aprono allo stesso modo, la frase "Wines that set the mood." dietro le stesse quattro bottiglie: qui c'è quell'apertura nei due mood insieme, divisa da un'onda.
     A sinistra Botanica (il bordeaux della Collezione 53, la targa col ginepro, Instrument Serif e DM Sans), a destra Pop (bianco e inchiostro, Londrina Solid e DM Sans). Misure di frase e targa
     come nelle home (css/pop-prove.css, css/botanica-pop.css). Le bottiglie sono le foto del catalogo, non il 3D: qui basta e sul telefono pesa meno.
     Il mouse sposta l'onda verso l'altro mood, il clic la porta fino al bordo, frase e bottiglie escono e la home fa il suo ingresso. js/mood.js, css/mood.css.
     La pagina di prima (prove Cambio e Onda, con le sale e le foto di Instagram) è in _archivio-prove/scelta-mood-cambio-onda-20nov. -->
<title>Feudi Salentini · Vini del Salento</title>
<meta name="description" content="Feudi Salentini: Primitivo di Manduria, Negroamaro e i vini del Salento della famiglia Varvaglione, a Leporano (TA).">

<link rel="stylesheet" href="css/mood.css">
</head>
<body class="page-porta">
<main id="main" class="mood">
  <h1 class="mood__t">Feudi Salentini: scegli il mood</h1>

  <!-- la stessa apertura due volte: Pop sotto, Botanica sopra, ritagliata fino all'onda (js/mood.js). --a, --b: dove sta il centro della bottiglia, --k: la sua altezza, --dx: quanto la bottiglia sta fuori centro nella foto (css/mood.css) -->
  <div class="mood__s mood__s--f" aria-hidden="true">
    <span class="logo mood__logo"></span>
    <p class="mood__frase"><span>Wines that</span><span>set the mood.</span></p>
    <div class="mood__bott">
      <img src="assets/bottles/primitivo53.webp" alt="" style="--a:-0.3874;--b:-1.5;--k:.92;--dx:-2.07%">
      <img src="assets/bottles/biook-2.webp" alt="" style="--a:-0.1413;--b:-.5;--k:.985;--dx:-.31%">
      <img src="assets/bottles/3CUORI.webp" alt="" style="--a:0.1146;--b:.5;--k:.905">
      <img src="assets/bottles/negroamaro.webp" alt="" style="--a:0.3764;--b:1.5;--k:1">
    </div>
  </div>
  <div class="mood__s mood__s--b" aria-hidden="true">
    <span class="mood__targa"><i></i></span>
    <span class="logo mood__logo"></span>
    <p class="mood__frase"><span>Wines that</span><span>set the mood.</span></p>
    <div class="mood__bott">
      <img src="assets/bottles/primitivo53.webp" alt="" style="--a:-0.3874;--b:-1.5;--k:.92;--dx:-2.07%">
      <img src="assets/bottles/biook-2.webp" alt="" style="--a:-0.1413;--b:-.5;--k:.985;--dx:-.31%">
      <img src="assets/bottles/3CUORI.webp" alt="" style="--a:0.1146;--b:.5;--k:.905">
      <img src="assets/bottles/negroamaro.webp" alt="" style="--a:0.3764;--b:1.5;--k:1">
    </div>
  </div>

  <a class="mood__z mood__z--b" href="botanica-pop.html" data-mood="b"><b class="mood__n">Botanica</b><span class="mood__v btn">Entra</span></a>
  <a class="mood__z mood__z--f" href="pop-b.html" data-mood="f"><b class="mood__n">Pop</b><span class="mood__v btn">Entra</span></a>
</main>
<script src="js/mood.js"></script>

</html>
